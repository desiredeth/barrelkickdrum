name: Build VST3 (Windows)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package portable zip
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item $vst.FullName -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath BarrelKickGenerator-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BarrelKickGenerator-VST3-win64
          path: BarrelKickGenerator-portable-win64.zip
